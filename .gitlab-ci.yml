# .gitlab-ci.yml — agentRoadmap CI (shell executor)

stages:
  - security
  - check
  - test
  - integration
  - build

variables:
  NODE_ENV: test

# ─── Stage 0: Security ────────────────────────────────────────
# gitleaks kept as advisory fallback; npm-package scan:secrets is the required gate.
secret-scan-advisory:
  stage: security
  script:
    - gitleaks detect --source . --verbose
  allow_failure: true

# Required gate: agenthive-scan-rules-secrets patterns (AgentHive-specific secrets).
# Baseline suppresses pre-existing findings; only NEW secrets block merge.
scan-secrets:
  stage: security
  script:
    - npm ci
    - npm run scan:secrets
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

dependency-audit:
  stage: security
  script:
    - npm ci
    - npm audit --audit-level=high
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  allow_failure: true

# ─── Stage 1: Check ───────────────────────────────────────────
type-check:
  stage: check
  script:
    - npm ci
    - npm run check:types
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

tsc-check:
  stage: check
  script:
    - npm ci
    - node node_modules/typescript/bin/tsc --project tsconfig.check.json
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

lint:
  stage: check
  script:
    - npm ci
    - npm run check
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  allow_failure: true

capability-coverage-check:
  stage: check
  script:
    - npm ci
    - bun run scripts/orchestrator-capability-coverage-check.ts
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

workflow-states-check:
  stage: check
  script:
    - npm ci
    - npm run scan:workflow-states
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Required gate: agenthive-scan-rules-multi-tenant (X-Project-Id bypass, cross-tenant leaks).
scan-multi-tenant:
  stage: check
  script:
    - npm ci
    - npm run scan:multi-tenant
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# Required gate: agenthive-scan-rules-agenthive (agenthive-specific hardcoded values).
scan-agenthive:
  stage: check
  script:
    - npm ci
    - npm run scan:agenthive
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# P1107 AC-8: MCP binary bundle gate. esbuild catches dup-declaration corruption
# that tsc misses (tsconfig.check.json excludes src/apps/mcp-server).
# Runs on every push; fails with the conflicting identifier named.
mcp-bundle-gate:
  stage: check
  script:
    - npm ci
    - npm run check:mcp-bundle
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

# P1107 AC-8: Migration continuity gate. Verifies every on-disk migration file
# matches a recorded row in roadmap.migration_history. Requires DB access.
migration-continuity:
  stage: check
  script:
    - npm ci
    - npm run check:migration-continuity
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  allow_failure: true

migration-schema-lint:
  stage: check
  script:
    - |
      set -euo pipefail
      # Extract roadmap.TABLENAME refs from TypeScript.
      # Require underscore (table naming convention); exclude fn_* functions and v_* views.
      ts=$(grep -rho 'roadmap\.[a-z][a-z0-9_]*' src/ --include='*.ts' 2>/dev/null \
             | grep -E 'roadmap\.[a-z0-9]+_[a-z0-9_]+' \
             | grep -vE 'roadmap\.(fn_|v_)' \
             | sed 's/roadmap\.//' | sort -u || true)
      # CREATE TABLE targets from the active runner path (scripts/migrations/)
      active=$(grep -rh 'CREATE TABLE' scripts/migrations/*.sql 2>/dev/null \
             | grep -oE '(roadmap\.)?[a-z][a-z0-9_]+' | grep '_' \
             | sed 's/roadmap\.//' | sort -u || true)
      # CREATE TABLE targets from the legacy inactive path (database/migrations/)
      legacy=$(grep -rh 'CREATE TABLE' database/migrations/*.sql 2>/dev/null \
             | grep -oE '(roadmap\.)?[a-z][a-z0-9_]+' | grep '_' \
             | sed 's/roadmap\.//' | sort -u || true)
      fail=0
      # P690 guard: table is in TS + legacy path but NOT active path → will vanish on fresh deploy
      drift=$(comm -23 <(echo "$ts") <(echo "$active") \
              | comm -12 - <(echo "$legacy") || true)
      if [ -n "$drift" ]; then
        echo "SCHEMA DRIFT: TypeScript references tables defined only in database/migrations/ (INACTIVE runner)."
        echo "These tables will not exist on a fresh deploy:"
        printf '  roadmap.%s\n' $drift
        echo "Fix: add a migration to scripts/migrations/ that creates the table(s)."
        fail=1
      fi
      # Orphan guard: table in TS but absent from ALL migration DDL
      orphaned=$(comm -23 <(echo "$ts") <(echo "$active") \
                 | comm -23 - <(echo "$legacy") || true)
      if [ -n "$orphaned" ]; then
        echo "MISSING DDL: TypeScript references roadmap.* tables absent from all migration DDL:"
        printf '  roadmap.%s\n' $orphaned
        echo "Fix: add a migration to scripts/migrations/ that creates the table(s)."
        fail=1
      fi
      [ "$fail" = "0" ] && echo "OK: all roadmap.* table refs covered by migration DDL."
      exit $fail

# ─── Stage 2: Test ────────────────────────────────────────────
test:
  stage: test
  script:
    - npm ci
    - npm test
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  timeout: 10m

# ─── Stage 3: Integration (P3842) ────────────────────────────
# Spawns each long-running service, sends SIGTERM, and asserts exit within 5s.
# Prevents regression of P3198 (SIGTERM hang fix).
# Skips individual service assertions when the service cannot start (no DB /
# infrastructure) — the job itself still passes in a clean-build environment.
sigterm-test:
  stage: integration
  needs: [test]
  script:
    - npm ci
    - node --import jiti/register --test tests/integration/sigterm-graceful.test.ts
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  timeout: 3m

# ─── Stage 4: Build ───────────────────────────────────────────
build:
  stage: build
  script:
    - npm ci
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
