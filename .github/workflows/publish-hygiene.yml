name: Publish Hygiene

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AUDIT_DATABASE_URL: ${{ secrets.AUDIT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Fetch main
        run: git fetch origin main --depth=1

      - name: Check publish hygiene
        run: npm run check:publish -- --base origin/main

      # P677: Pre-merge migration linkage check. Greps the codebase for any
      # column reference that a staged migration's DROP/RENAME would break.
      # False positives go into scripts/ci/sql-audit-allowlist.txt.
      - name: SQL migration linkage check
        run: npm run audit:migrations

      # P677: Pre-merge SQL column audit. Validates qualified column refs in
      # SQL string literals against information_schema.columns. v1 is
      # regex-based + conservative (skips alias-qualified refs); v2 will plug
      # in pg-query-emscripten. Currently runs informational — enable gating
      # by removing `continue-on-error` once existing flagged drift sites are
      # remediated or allowlisted.
      - name: SQL column audit (informational)
        if: ${{ env.AUDIT_DATABASE_URL != '' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.AUDIT_DATABASE_URL }}
        run: npm run audit:sql

      # P786: TypeScript hot-path check. Fails if hive-cli, cubic-agents, gate,
      # or pool introduce new type errors.
      - name: TypeScript hot-path check
        run: npm run typecheck

      # P779: Scanner guard for legacy workflow state literals.
      # Fails CI if any .ts/.tsx file outside migrations/tests hardcodes
      # RFC or Hotfix stage names instead of importing from the stage registry.
      # NOTE: Marked informational until P453 implements the canonical state-names module
      - name: Workflow state literal guard
        continue-on-error: true
        run: npm run scan:workflow-states

      # P1107 AC-8: Verify migration continuity — on-disk migration files match the
      # recorded history table (no files tampered, no gaps inserted). Runs on every
      # PR so migration reordering or checksum drift is caught before merge.
      - name: Migration continuity check
        if: ${{ env.AUDIT_DATABASE_URL != '' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.AUDIT_DATABASE_URL }}
        run: npm run check:migration-continuity

      # P3794: SIGTERM clean-exit regression guard. Boots each long-running service
      # entrypoint in CI, sends SIGTERM, and asserts it exits within 10 s — preventing
      # new services from being added without a graceful shutdown path.
      # Gated on AUDIT_DATABASE_URL (live DB required); continue-on-error until infra
      # is confirmed stable in CI.
      - name: SIGTERM clean-exit e2e
        if: ${{ env.AUDIT_DATABASE_URL != '' }}
        continue-on-error: true
        env:
          DATABASE_URL: ${{ env.AUDIT_DATABASE_URL }}
          AGENTHIVE_SIGTERM_E2E: "1"
        run: node --import jiti/register --test src/shared/runtime/graceful-exit.test.ts --test-name-pattern 'entrypoint SIGTERM'

      # P690: Guard against migrations being placed in the legacy inactive runner
      # directory (database/migrations/) instead of the active path (scripts/migrations/).
      # Fails if any .sql file in database/migrations/ appears in the current PR diff.
      - name: Legacy migration directory guard
        run: |
          LEGACY_SQL=$(git diff --name-only origin/main...HEAD -- 'database/migrations/*.sql' 2>/dev/null || true)
          if [ -n "$LEGACY_SQL" ]; then
            echo "::error::New SQL migration(s) committed to the INACTIVE legacy path (database/migrations/)."
            echo "::error::These will NEVER be applied by the active runner. Move them to scripts/migrations/."
            printf '%s\n' "$LEGACY_SQL" | sed 's/^/  /'
            exit 1
          fi
          echo "Legacy migration directory guard: no new SQL files in database/migrations/ — OK."
