; PgBouncer configuration template — AgentHive P499
; Transaction-mode pooling in front of Postgres for tenant + control pool fanout.
;
; DEPLOYMENT INSTRUCTIONS:
; 1. Copy this file to /etc/pgbouncer/pgbouncer.ini (or source location per ops)
; 2. Edit [databases] section: add all tenant database entries via scripts/pgbouncer/provision-pgbouncer.ts
; 3. Edit [pgbouncer] auth_file to point to your /etc/pgbouncer/userlist.txt
; 4. Populate userlist.txt with SCRAM-SHA-256 hashes from pg_authid
; 5. Start/reload: sudo systemctl start pgbouncer && sudo systemctl reload pgbouncer
;
; CRITICAL: LISTEN/NOTIFY clients MUST bypass PgBouncer.
; See pool-registry.ts (line ~395), config.ts, feature-flag-service.ts for bypass setup.
; Use PGPORT_DIRECT=5432 or AGENTHIVE_LISTEN_PORT=5432 for any LISTEN-issuing connection.

[databases]
; Control-plane database (queries route through this entry to PgBouncer pooler)
agenthive = host=127.0.0.1 port=5432 dbname=agenthive

; Tenant databases — add one entry per tenant slug at onboard time via provision-pgbouncer.ts
; Format: <slug> = host=<db_host> port=<db_port> dbname=<db_name> user=<db_user>
; Example:
; monkeyking-audio = host=127.0.0.1 port=5432 dbname=monkeyKing-audio
; georgia-singer    = host=127.0.0.1 port=5432 dbname=georgia-singer

; Wildcard fallback: routes any unmatched dbname to Postgres directly.
; Remove this once all tenants are listed explicitly.
* = host=127.0.0.1 port=5432

[pgbouncer]
; --- Transport ---
listen_addr = 127.0.0.1
listen_port = 6432

; --- Pooling ---
pool_mode = transaction
default_pool_size = 20
max_client_conn = 400
reserve_pool_size = 5
reserve_pool_timeout = 3

; --- Auth ---
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; --- Logging ---
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
syslog = 0

; --- Admin / stats ---
; Connect to the virtual "pgbouncer" database to run SHOW POOLS / SHOW STATS.
; Admin users must also appear in userlist.txt.
admin_users = agenthive_admin
stats_users = agenthive_admin, agenthive_app

; --- Timeouts ---
server_idle_timeout = 600
client_idle_timeout = 0
server_connect_timeout = 15
server_login_retry = 5
query_timeout = 0
query_wait_timeout = 120

; --- Server TLS (disable for loopback) ---
server_tls_sslmode = disable

; --- Ignore startup params that some clients always send ---
ignore_startup_parameters = extra_float_digits,application_name
