; PgBouncer configuration for AgentHive (P499)
; Transaction-mode pooling in front of Postgres for tenant + control pool fanout.
;
; DEPLOYMENT PATH: /etc/pgbouncer/pgbouncer.ini
; RELOAD:          systemctl reload pgbouncer
;                  OR: psql -p 6432 pgbouncer -c "RELOAD"
;
; CRITICAL CONSTRAINT: LISTEN/NOTIFY clients MUST bypass this bouncer.
; Use PGPORT_DIRECT=5432 for any connection that issues LISTEN.
; Transaction-mode pooling drops persistent connections between transactions,
; which breaks LISTEN state. Code locations that bypass:
;   - src/shared/runtime/feature-flag-service.ts (config reload via LISTEN)
;   - src/infra/agency/liaison-agent.ts (agency events via LISTEN)
;   - src/memory/memory-event-consumer.ts (memory events via LISTEN)
;   - Any other subscriber using pgPort_DIRECT env var
;
; See: docs/architecture/pgbouncer.md for full rationale and deployment guide.

[databases]
; Control-plane database (hiveCentral / agenthive)
agenthive = host=127.0.0.1 port=5432 dbname=agenthive

; Future: hiveCentral on separate Postgres instance (P518)
; hiveCentral = host=hivecentral-db port=5432 dbname=hiveCentral

; Tenant databases — add one entry per active tenant at onboard time.
; Format: <tenant_slug> = host=127.0.0.1 port=5432 dbname=<tenant_db_name>
; Example:
;   monkeyking-audio = host=127.0.0.1 port=5432 dbname=monkeyKing_audio
;   georgia-singer   = host=127.0.0.1 port=5432 dbname=georgia_singer
;
; GENERATED BY: scripts/pgbouncer/provision-pgbouncer.ts (P499)
; DO NOT EDIT MANUALLY — this section is auto-generated on tenant onboard.

; Wildcard fallback: any unmatched dbname routes to Postgres directly.
; Remove once all tenants are listed explicitly, OR adjust as needed for multi-tenant.
* = host=127.0.0.1 port=5432

[pgbouncer]
; === Transport ===
listen_addr = 127.0.0.1
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777

; === Pooling Strategy ===
; pool_mode = transaction (REQUIRED for AgentHive)
;   - Reuses backend connections between transactions (not within transactions)
;   - Lower overhead than session-mode; more connection reuse than statement-mode
;   - Incompatible with LISTEN/NOTIFY (use PGPORT_DIRECT=5432 for listeners)
;   - Incompatible with prepared statements (we don't use server-side prepared statements)
;   - Incompatible with SET LOCAL (we use schema-qualified names, not search_path)
pool_mode = transaction

; === Connection Limits ===
; max_client_conn: max concurrent client connections to PgBouncer
;   Each client conn is assigned a backend slot or queued.
max_client_conn = 400

; default_pool_size: backend connections PER DATABASE (per user)
;   For agenthive DB with 5+ processes, each with ~30 query clients,
;   default_pool_size=20 provides 20 active + min_pool_size idle.
;   For tenants, defaults to 8 (tunable per tenant in roadmap.project).
default_pool_size = 20

; min_pool_size: minimum idle connections per database (per user)
;   Warmed on startup; shrinks to 1 after idle timeout if load drops.
min_pool_size = 1

; reserve_pool_size: extra connections available if all default slots are busy
;   When all default_pool_size connections are active, reserve_pool_size
;   provides emergency overflow (total = default + reserve).
reserve_pool_size = 5

; reserve_pool_timeout: seconds to wait for a backend from reserve pool
;   If a request waits this long, transaction is canceled (not queued forever).
reserve_pool_timeout = 3

; === Authentication ===
; auth_type: SCRAM-SHA-256 required for security (no plaintext)
auth_type = scram-sha-256

; auth_file: path to userlist.txt with role credentials
;   Format: "username" "scram-sha-256-hash"
;   Generated by: scripts/pgbouncer/bootstrap-users.sh (P499)
;   Permissions: 0600, owned by pgbouncer:pgbouncer
auth_file = /etc/pgbouncer/userlist.txt

; === Timeouts ===
; server_lifetime: max age of a backend connection (seconds)
;   Periodic rotation for long-lived connections; 3600s = 1 hour
server_lifetime = 3600

; server_idle_timeout: disconnect backend if idle > N seconds
;   Recycles idle connections back to Postgres; 600s = 10 minutes
server_idle_timeout = 600

; client_idle_timeout: disconnect client if idle > N seconds
;   Set to 0 (infinity) — application handles client-side timeouts
client_idle_timeout = 0

; server_connect_timeout: max seconds to establish new backend connection
;   If Postgres is slow, PgBouncer gives up and returns connection error.
server_connect_timeout = 15

; server_login_retry: times to retry a failed login attempt
;   If Postgres rejects credentials, don't spam retries.
server_login_retry = 5

; query_timeout: query must complete within N seconds (0 = no timeout)
;   Set to 0 — let Postgres statement_timeout handle query timeouts.
query_timeout = 0

; query_wait_timeout: max seconds to wait in queue before canceling
;   When all backend slots are busy and queue is full, new requests wait this long.
;   Prevents clients from hanging forever.
query_wait_timeout = 120

; === Server TLS (disabled for loopback) ===
; PgBouncer ↔ Postgres (loopback 127.0.0.1): TLS off (trusted segment)
; Client ↔ PgBouncer (loopback 127.0.0.1): TLS off (trusted segment)
; Future: TLS between bouncer and remote Postgres clusters (P??).
server_tls_sslmode = disable

; === Logging & Diagnostics ===
; logfile: path to log file (created and rotated by systemd/logrotate)
;   Rotated daily; set via deploy/systemd/ or /var/log/pgbouncer permissions.
logfile = /var/log/pgbouncer/pgbouncer.log

; pidfile: PgBouncer process ID file
;   Created by systemd in RuntimeDirectory=/var/run/pgbouncer
pidfile = /var/run/pgbouncer/pgbouncer.pid

; log_connections: log all new client connections (set to 0 for production)
;   With 85+ connections per tenant, produces noise. Use only for debugging.
log_connections = 0

; log_disconnections: log all client disconnections (set to 0 for production)
;   Paired with log_connections; produces noise under load.
log_disconnections = 0

; log_pooler_errors: log connection/pool errors (keep enabled)
;   Important for diagnosing pool exhaustion, backend failures, auth errors.
log_pooler_errors = 1

; syslog: also send logs to syslog (disabled; systemd journal is sufficient)
syslog = 0

; stats_period: recalculate SHOW STATS every N seconds
;   Resets counters for avg_* columns in SHOW STATS output.
stats_period = 60

; === Admin Console ===
; admin_users: can issue admin commands (RELOAD, FLUSH, SHUTDOWN, etc.)
;   Must be present in auth_file (userlist.txt).
admin_users = agenthive_admin

; stats_users: can issue SHOW commands (read-only diagnostics)
;   Useful for monitoring without admin privileges.
stats_users = agenthive_admin, agenthive_app

; === systemd Integration ===
; service_name: required for systemd Type=notify WatchdogSec
;   PgBouncer sends periodic sd_notify watchdog pings; systemd restarts on timeout.
service_name = pgbouncer

; === Compatibility ===
; ignore_startup_parameters: client sends these params; PgBouncer discards them
;   - extra_float_digits: Python psycopg2 sends this; PgBouncer doesn't support
;   - application_name: clients may set; PgBouncer ignores, passes to backend
;   - search_path: NEVER SET in transaction-mode (use schema-qualified names)
ignore_startup_parameters = extra_float_digits,application_name
