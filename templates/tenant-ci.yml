# P516: Tenant Project CI/CD Template
#
# Copy this file to your tenant repository as `.gitlab-ci.yml`
# and customize stages/scripts as needed for your specific project.
#
# Stages:
#   - lint: ESLint, Prettier, TypeScript checks
#   - test: Unit and integration tests
#   - security-scan: npm audit and dependency checks
#   - publish: Publish shared libraries (optional, for @agenthive/*)

stages:
  - lint
  - test
  - security-scan
  - publish

# Default variables
variables:
  NODE_ENV: test
  NODE_OPTIONS: "--max-old-space-size=2048"

# ─── Lint Stage ──────────────────────────────────────────────────────────────

lint:eslint:
  stage: lint
  image: node:20-alpine
  script:
    - npm install
    - npm run lint || true  # Warn on lint failures but don't block
  only:
    - merge_requests
    - main
  artifacts:
    reports:
      codequality: lint-report.json
    expire_in: 1 week

lint:types:
  stage: lint
  image: node:20-alpine
  script:
    - npm install
    - npx tsc --noEmit
  only:
    - merge_requests
    - main

# ─── Test Stage ──────────────────────────────────────────────────────────────

test:unit:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npm test
  coverage: '/Coverage: \d+\.\d+%/'
  only:
    - merge_requests
    - main
    - /^dev\/.*/  # Also run on dev/* branches
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: test-results.xml
    paths:
      - coverage/
    expire_in: 30 days

test:integration:
  stage: test
  image: node:20-alpine
  services:
    - postgres:15
  variables:
    POSTGRES_DB: tenant_test
    POSTGRES_USER: tenant_user
    POSTGRES_PASSWORD: tenant_password
  script:
    - npm install
    - npm run test:integration || true  # Warn on integration test failures
  only:
    - merge_requests
    - main

# ─── Security Scan Stage ─────────────────────────────────────────────────────

security:audit:
  stage: security-scan
  image: node:20-alpine
  script:
    - npm install
    - npm audit --production || true  # Warn on vulnerabilities but don't block
  only:
    - merge_requests
    - main
  artifacts:
    reports:
      dependency_scanning: npm-audit-report.json
    expire_in: 30 days

security:snyk:
  stage: security-scan
  image: node:20-alpine
  script:
    - npm install
    - npm install -g snyk
    - snyk test --json > snyk-report.json || true
  only:
    - merge_requests
    - main
  artifacts:
    paths:
      - snyk-report.json
    expire_in: 30 days
  allow_failure: true

# ─── Publish Stage (Optional, for Shared Libraries) ───────────────────────────

publish:npm:
  stage: publish
  image: node:20-alpine
  script:
    - npm install
    - npm run build
    - npm publish
  only:
    - tags  # Only publish on semver tags (e.g., v1.2.3)
  except:
    - branches
  when: manual  # Require manual approval before publishing

# ─── Merge Request Validation ────────────────────────────────────────────────

merge_request_only:
  stage: lint
  image: alpine:latest
  script:
    - echo "Merge request validation passed"
  only:
    - merge_requests
  allow_failure: true

