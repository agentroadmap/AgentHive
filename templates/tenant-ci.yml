stages:
  - lint
  - test
  - security
  - publish

default:
  image: node:24
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint

test:
  stage: test
  script:
    - npm test

security_scan:
  stage: security
  script:
    - npm audit --audit-level=high

publish_shared_libs:
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
      exists:
        - package.json
  script:
    - npm publish
